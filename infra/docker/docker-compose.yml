name: healthcare-ai-interoperability-lab

services:
  hapi-fhir-postgres:
    image: postgres:16-alpine
    container_name: hapi-fhir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HAPI_DB_NAME:-hapi}
      POSTGRES_USER: ${HAPI_DB_USER:-hapi}
      POSTGRES_PASSWORD: ${HAPI_DB_PASSWORD:-hapi}
    volumes:
      - hapi-fhir-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HAPI_DB_USER:-hapi} -d ${HAPI_DB_NAME:-hapi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  hapi-fhir:
    image: hapiproject/hapi:v8.10.0-3
    container_name: hapi-fhir
    restart: unless-stopped
    depends_on:
      hapi-fhir-postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://hapi-fhir-postgres:5432/${HAPI_DB_NAME:-hapi}
      SPRING_DATASOURCE_USERNAME: ${HAPI_DB_USER:-hapi}
      SPRING_DATASOURCE_PASSWORD: ${HAPI_DB_PASSWORD:-hapi}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_SEARCH_ENABLED: "false"

  lab-oauth:
    build:
      context: ./oauth
    container_name: lab-oauth
    restart: unless-stopped
    environment:
      LAB_OAUTH_CLIENT_ID: lab-client
      LAB_OAUTH_CLIENT_SECRET: ${LAB_OAUTH_CLIENT_SECRET:-lab-secret}
      LAB_OAUTH_ACCESS_TOKEN: lab-access-token
      LAB_OAUTH_EXPIRES_IN: "3600"
      LAB_SMART_CLIENT_ID: lab-smart-app
      LAB_SMART_REDIRECT_URI: http://127.0.0.1:8081/smart/callback
      LAB_SMART_AUD: http://localhost:8180/fhir
      LAB_SMART_PATIENT: patient-001
    ports:
      - "9090:9090"

  fhir-gateway:
    image: nginx:1.27-alpine
    container_name: fhir-gateway
    restart: unless-stopped
    depends_on:
      - hapi-fhir
      - lab-oauth
    ports:
      - "8180:80"
    volumes:
      - ./fhir-gateway/nginx.conf:/etc/nginx/nginx.conf:ro

  mini-lis-postgres:
    image: postgres:16-alpine
    container_name: mini-lis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: minilis
      POSTGRES_USER: minilis
      POSTGRES_PASSWORD: minilis
    ports:
      - "5433:5432"
    volumes:
      - mini-lis-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minilis -d minilis"]
      interval: 5s
      timeout: 5s
      retries: 10

  mini-lis:
    build:
      context: ../../services/mini-lis-service
    container_name: mini-lis
    restart: unless-stopped
    depends_on:
      mini-lis-postgres:
        condition: service_healthy
    ports:
      - "8096:8096"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8096"
      MINI_LIS_ALLOW_EXTERNAL_BIND: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://mini-lis-postgres:5432/minilis
      SPRING_DATASOURCE_USERNAME: minilis
      SPRING_DATASOURCE_PASSWORD: minilis
      MINI_LIS_SERVICE_TOKEN: ${MINI_LIS_SERVICE_TOKEN:-lab-mini-lis-dev}

volumes:
  hapi-fhir-postgres-data:
  mini-lis-postgres-data:
