worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log /var/log/nginx/access.log;

    server {
        listen 80;
        error_page 401 = @unauthorized;
        error_page 403 = @forbidden;

        location = /fhir/.well-known/smart-configuration {
            proxy_pass http://lab-oauth:9090/.well-known/smart-configuration;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
        }

        location /fhir {
            auth_request /_auth;
            proxy_pass http://hapi-fhir:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization "";
            proxy_hide_header Authorization;
        }

        location = /_auth {
            internal;
            proxy_pass http://lab-oauth:9090/oauth/resource;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
        }

        location @unauthorized {
            add_header WWW-Authenticate 'Bearer realm="secured-lab"' always;
            default_type application/json;
            return 401 '{"error":"invalid_token"}';
        }

        location @forbidden {
            add_header WWW-Authenticate 'Bearer realm="secured-lab", error="insufficient_scope"' always;
            default_type application/json;
            return 403 '{"error":"insufficient_scope"}';
        }

        location / {
            return 404;
        }
    }
}
