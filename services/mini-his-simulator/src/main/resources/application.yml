server:
  address: 127.0.0.1
  port: 8095
  forward-headers-strategy: framework
  tomcat:
    remoteip:
      internal-proxies: "127\\.0\\.0\\.1|::1"
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${MINI_HIS_COOKIE_SECURE:false}

spring:
  flyway:
    enabled: false

mini-his:
  allow-container-bind: ${MINI_HIS_ALLOW_CONTAINER_BIND:false}
  sqlite-path: data/mini-his.sqlite
  organization-id: org-mini-his
  exchange:
    base-url: ${MINI_HIS_EXCHANGE_BASE_URL:}
    service-token: ${MINI_HIS_EXCHANGE_TOKEN:}
    connect-timeout: 2s
    read-timeout: 5s
  inpatient:
    service-token: ${MINI_HIS_INPATIENT_TOKEN:}
    ward-password: ${MINI_HIS_WARD_PASSWORD:}
    coordinator-url: ${DISCHARGE_COORDINATOR_URL:}
  oidc:
    enabled: ${MINI_HIS_OIDC_ENABLED:false}
    client-enabled: ${MINI_HIS_OIDC_CLIENT_ENABLED:false}
    issuer: ${MINI_HIS_OIDC_ISSUER:}
    audience: ${MINI_HIS_OIDC_AUDIENCE:mini-his-web}
    client-id: ${MINI_HIS_OIDC_CLIENT_ID:mini-his-web}
    bindings: ${MINI_HIS_OIDC_BINDINGS:}
    acceptance: ${MINI_HIS_OIDC_ACCEPTANCE:false}

showcase:
  lis-health: ${SHOWCASE_LIS_HEALTH:http://127.0.0.1:8096/health}
  fhir-health: ${SHOWCASE_FHIR_HEALTH:http://127.0.0.1:8081/actuator/health}
  ai-health: ${SHOWCASE_AI_HEALTH:http://127.0.0.1:8090/health}
  longitudinal-health: ${SHOWCASE_LONGITUDINAL_HEALTH:}
  lis-bench: ${SHOWCASE_LIS_BENCH:http://127.0.0.1:8096/bench/orders}
