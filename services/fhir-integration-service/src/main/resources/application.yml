spring:
  application:
    name: fhir-integration-service

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

fhir:
  active-server: local-hapi
  servers:
    local-hapi:
      base-url: http://localhost:8080/fhir
      fhir-version: R4
      enabled: true
    example-org:
      base-url: https://example.org/fhir
      fhir-version: R4
      enabled: false
