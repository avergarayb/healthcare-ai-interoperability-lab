spring:
  application:
    name: fhir-integration-service

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

fhir:
  resilience:
    rate-limit:
      max-operations: 10
      window: 1s
    bulkhead:
      max-concurrent-operations: 5
    circuit-breaker:
      failure-threshold: 3
      reset-timeout: 30s
    retry:
      max-attempts: 3
      initial-backoff: 100ms
  active-server: local-hapi
  servers:
    local-hapi:
      base-url: http://localhost:8080/fhir
      fhir-version: R4
      enabled: true
      authentication:
        type: NONE
      vendor-integration:
        patient-id: ${LOCAL_HAPI_PATIENT_ID:}
    example-org:
      base-url: https://example.org/fhir
      fhir-version: R4
      enabled: false
      authentication:
        type: NONE
    secured-lab:
      base-url: http://localhost:8180/fhir
      fhir-version: R4
      enabled: false
      authentication:
        type: OAUTH2_CLIENT_CREDENTIALS
        token-url: http://localhost:9090/oauth/token
        client-id: lab-client
        client-secret: ${FHIR_SECURED_LAB_CLIENT_SECRET:}
    smart-lab:
      base-url: http://localhost:8180/fhir
      fhir-version: R4
      enabled: false
      authentication:
        type: SMART_AUTHORIZATION_CODE
        smart-configuration-url: http://localhost:8180/fhir/.well-known/smart-configuration
        client-id: lab-smart-app
        redirect-uri: http://127.0.0.1:8081/smart/callback
        scope: patient/Patient.read patient/Observation.read
        aud: http://localhost:8180/fhir
    epic-sandbox:
      enabled: ${EPIC_SANDBOX_ENABLED:false}
      vendor: EPIC
      base-url: https://fhir.epic.com/interconnect-fhir-oauth/api/FHIR/R4/
      fhir-version: R4
      authentication:
        type: SMART_AUTHORIZATION_CODE
        client-id: ${EPIC_SANDBOX_CLIENT_ID:}
        redirect-uri: ${EPIC_SANDBOX_REDIRECT_URI:}
        scope: ${EPIC_SANDBOX_SCOPE:}
        aud: ${EPIC_SANDBOX_AUD:https://fhir.epic.com/interconnect-fhir-oauth/api/FHIR/R4/}
        smart-configuration-url: ${EPIC_SANDBOX_SMART_CONFIGURATION_URL:}
      vendor-integration:
        environment: SANDBOX
        launch-mode: STANDALONE
        user-context: PATIENT
        client-authentication: PUBLIC_PKCE
        patient-id: ${EPIC_SANDBOX_PATIENT_ID:}
    oracle-health-sandbox:
      enabled: ${ORACLE_HEALTH_SANDBOX_ENABLED:false}
      vendor: ORACLE_HEALTH
      fhir-version: R4
      base-url: ${ORACLE_HEALTH_SANDBOX_BASE_URL:}
      authentication:
        type: SMART_AUTHORIZATION_CODE
        client-id: ${ORACLE_HEALTH_SANDBOX_CLIENT_ID:}
        redirect-uri: ${ORACLE_HEALTH_SANDBOX_REDIRECT_URI:}
        scope: ${ORACLE_HEALTH_SANDBOX_SCOPE:}
        aud: ${ORACLE_HEALTH_SANDBOX_AUD:}
        smart-configuration-url: ${ORACLE_HEALTH_SANDBOX_SMART_CONFIGURATION_URL:}
      vendor-integration:
        environment: SANDBOX
        launch-mode: STANDALONE
        user-context: PATIENT
        client-authentication: PUBLIC_PKCE
        patient-id: ${ORACLE_HEALTH_SANDBOX_PATIENT_ID:}

clinical-read:
  source: local-hapi
  mini-his:
    base-url: http://127.0.0.1:8095
    connect-timeout: 2s
    read-timeout: 5s
  mini-lis:
    base-url: http://127.0.0.1:8096
    service-token: ${MINI_LIS_SERVICE_TOKEN:lab-mini-lis-dev}
    connect-timeout: 2s
    read-timeout: 5s

interop:
  sources:
    mini-his:
      organization-id: org-mini-his
      display-name: Mini HIS
      base-url: http://127.0.0.1:8095
      capabilities:
        - patient
        - encounter
        - observation
        - appointment
        - service-request
    mini-lis:
      organization-id: org-mini-lis
      display-name: Mini LIS
      base-url: http://127.0.0.1:8096
      capabilities:
        - patient
        - service-request
        - observation
        - diagnostic-report

exchange:
  store-path: ${EXCHANGE_STORE_PATH:${java.io.tmpdir}/healthcare-lab-exchange/correlation.sqlite}
  participants:
    mini-his:
      service-token: ${EXCHANGE_MINI_HIS_TOKEN:}
    mini-lis:
      service-token: ${EXCHANGE_MINI_LIS_TOKEN:}
  connectors:
    mini-lis:
      protocol: ${EXCHANGE_MINI_LIS_PROTOCOL:rest}
      base-url: ${EXCHANGE_MINI_LIS_BASE_URL:http://127.0.0.1:8096}
      service-token: ${EXCHANGE_MINI_LIS_SERVICE_TOKEN:}
      connect-timeout: 2s
      read-timeout: 5s
      hl7:
        host: ${EXCHANGE_MINI_LIS_HL7_HOST:127.0.0.1}
        port: ${EXCHANGE_MINI_LIS_HL7_PORT:2575}
        shared-secret: ${EXCHANGE_MINI_LIS_HL7_SECRET:}
        listen-port: ${EXCHANGE_HL7_LISTEN_PORT:2576}
        sending-application: FHIR-EXCHANGE
        sending-facility: fhir-integration-service
        receiving-application: MINI-LIS
        receiving-facility: org-mini-lis

federation:
  max-sources: 4
  max-entries: 100
  query-budget-seconds: 20
  participants:
    mini-his:
      service-token: ${FEDERATION_MINI_HIS_TOKEN:}
    mini-lis:
      service-token: ${FEDERATION_MINI_LIS_TOKEN:}
  grants:
    mini-his:
      - mini-his
      - mini-lis
    mini-lis:
      - mini-lis
