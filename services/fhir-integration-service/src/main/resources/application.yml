spring:
  application:
    name: fhir-integration-service

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

fhir:
  resilience:
    rate-limit:
      max-operations: 10
      window: 1s
    bulkhead:
      max-concurrent-operations: 5
    circuit-breaker:
      failure-threshold: 3
      reset-timeout: 30s
    retry:
      max-attempts: 3
      initial-backoff: 100ms
  active-server: local-hapi
  servers:
    local-hapi:
      base-url: http://localhost:8080/fhir
      fhir-version: R4
      enabled: true
      authentication:
        type: NONE
    example-org:
      base-url: https://example.org/fhir
      fhir-version: R4
      enabled: false
      authentication:
        type: NONE
    secured-lab:
      base-url: http://localhost:8180/fhir
      fhir-version: R4
      enabled: false
      authentication:
        type: OAUTH2_CLIENT_CREDENTIALS
        token-url: http://localhost:9090/oauth/token
        client-id: lab-client
        client-secret: ${FHIR_SECURED_LAB_CLIENT_SECRET:}
    smart-lab:
      base-url: http://localhost:8180/fhir
      fhir-version: R4
      enabled: false
      authentication:
        type: SMART_AUTHORIZATION_CODE
        smart-configuration-url: http://localhost:8180/fhir/.well-known/smart-configuration
        client-id: lab-smart-app
        redirect-uri: http://127.0.0.1:8081/smart/callback
        scope: patient/Patient.read patient/Observation.read
        aud: http://localhost:8180/fhir
    epic-sandbox:
      enabled: false
      vendor: EPIC
      base-url: https://fhir.epic.com/interconnect-fhir-oauth/api/FHIR/R4/
      fhir-version: R4
      authentication:
        type: SMART_AUTHORIZATION_CODE
        client-id: ${EPIC_SANDBOX_CLIENT_ID:}
        redirect-uri: ${EPIC_SANDBOX_REDIRECT_URI:}
        scope: ${EPIC_SANDBOX_SCOPE:}
        aud: https://fhir.epic.com/interconnect-fhir-oauth/api/FHIR/R4/
        smart-configuration-url: ${EPIC_SANDBOX_SMART_CONFIGURATION_URL:}
      vendor-integration:
        environment: SANDBOX
        launch-mode: STANDALONE
        user-context: PATIENT
        client-authentication: PUBLIC_PKCE
